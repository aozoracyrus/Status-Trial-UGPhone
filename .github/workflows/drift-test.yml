name: drift-test

on:
  workflow_dispatch:

jobs:
  drift-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Chrome + deps (giống runner.yml)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          google-chrome-stable xvfb \
          libatk1.0-0 libatk-bridge2.0-0 libcairo2 libcups2 libdbus-1-3 \
          libgdk-pixbuf-xlib-2.0-0 libgtk-3-0 libnspr4 libpango-1.0-0 libxss1 \
          fonts-liberation libxkbcommon0 libxrandr2 libasound2t64 libatspi2.0-0

    - name: Install DrissionPage
      run: pip install DrissionPage

    - name: Run drift test (headed Chrome + CDP qua Xvfb)
      run: xvfb-run --server-args="-screen 0 1920x1080x24" python -u drift_test.py

    - name: Upload screenshot
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: drift-screenshot
        path: drift_test.png
