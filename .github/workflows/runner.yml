name: 🔍 Check Status Trial UGPhone

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Chrome & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          google-chrome-stable xvfb libatk1.0-0 libatk-bridge2.0-0 \
          libcairo2 libcups2 libdbus-1-3 libgdk-pixbuf2.0-0 libgtk-3-0 \
          libnspr4 libpango-1.0-0 libxss1 fonts-liberation libxdg-basedir1

    - name: Install Python Packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Pre-download Camoufox
      run: python -m camoufox fetch

    - name: Run 345-Minute Loop
      run: xvfb-run --server-args="-screen 0 1280x1024x24" python long_runner.py
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        ROLE_PING_ID: ${{ secrets.ROLE_PING_ID }}

    - name: Commit State (Save Message ID)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/
        git diff --staged --quiet || git commit -m "Relay: Save state at minute 345"

        # ✅ FIX: kéo commit mới từ remote về trước khi push
        # (chống lỗi "rejected - fetch first" khi có người sửa file lúc job đang chạy)
        git pull --rebase origin main || {
          git rebase --abort
          git pull --no-edit -X ours origin main || true
        }
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.PAT }}

    - name: Trigger Next Runner
      run: |
        curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.PAT }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/runner.yml/dispatches \
          -d '{"ref":"main"}'
