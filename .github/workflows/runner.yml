name: 🔍 Check Status Trial UGPhone

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Chrome & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          google-chrome-stable xvfb libatk1.0-0 libatk-bridge2.0-0 \
          libcairo2 libcups2 libdbus-1-3 libgdk-pixbuf2.0-0 libgtk-3-0 \
          libnspr4 libpango-1.0-0 libxss1 fonts-liberation libxdg-basedir1

    - name: Install Python Packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run 345-Minute Loop
      run: xvfb-run --server-args="-screen 0 1280x1024x24" python -u long_runner.py
      env:
        PYTHONUNBUFFERED: "1"
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        ROLE_PING_ID: ${{ secrets.ROLE_PING_ID }}

    - name: Commit State (Force Push nếu cần)
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/
        
        if git diff --staged --quiet; then
          echo "Không có thay đổi để commit"
          exit 0
        fi
        
        git commit -m "Relay: Save state at minute 345"
        git push --force-with-lease origin main || {
          echo "⚠️ Force push fail, thử reset và push lại..."
          git fetch origin main
          git reset --soft origin/main
          git add data/
          git commit -m "Relay: Save state (force)" || true
          git push origin main
        }
      env:
        GITHUB_TOKEN: ${{ secrets.PAT }}

    # ✅ FIX: Luôn trigger job tiếp theo dù job hiện tại fail
    - name: Trigger Next Runner
      if: always()
      run: |
        echo "🚀 Đang trigger job tiếp theo..."
        curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.PAT }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/runner.yml/dispatches \
          -d '{"ref":"main"}'
